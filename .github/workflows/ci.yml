name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity for worktree tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Verify bundled Cloudscape assets
        run: |
          npm ci
          npm run check:ui
      - name: Run the test suite
        run: npm run test:ci
      - name: Publish failing tests as annotations
        if: failure()
        run: node scripts/ci-annotate.mjs test-results.tap
      - name: First-run smoke (start, hooks, first ticket, status, dashboard link)
        run: node scripts/install-smoke.mjs
      - name: Hook latency (whole process, as the host sees it)
        run: node scripts/bench-hooks.mjs --calls 30
      - name: Validate plugin layout (manifest parses, hooks reference existing files)
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('hooks/hooks.json','utf8')); console.log('plugin files parse')"

  perf-full:
    name: A19 full profile (10k tickets / 100k events)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: QUILL_PERF_FULL=1 node --test tests/acceptance/perf.test.js
